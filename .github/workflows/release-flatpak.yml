name: Release Flatpak

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu's own apt packages are far behind what gtkx codegen needs: noble ships
    # GTK4 4.14 and libadwaita 1.5, well under gtkx's floor of GTK4 >=4.20 and
    # Adwaita >=1.8 (confirmed against packages.ubuntu.com). codegen runs directly on
    # this container's filesystem, introspecting whatever GTK4/Adwaita is actually
    # installed here - it isn't satisfied by the Flatpak runtime installed below,
    # which only matters once flatpak-builder packages the app. Fedora tracks GNOME
    # releases closely enough to have a current-enough GTK4/Adwaita in its own repos.
    # --privileged is required for flatpak-builder's bubblewrap sandboxing to work
    # inside a container; see https://github.com/flatpak/flatpak-github-actions.
    container:
      image: fedora:latest
      options: --privileged
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          dnf install -y \
            flatpak flatpak-builder \
            desktop-file-utils appstream \
            gtk4-devel libadwaita-devel gobject-introspection-devel \
            git tar xz pkgconf-pkg-config
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache the Flatpak runtime/SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-user-gnome-50

      - name: Install the GNOME runtime and SDK
        run: flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Flatpak
        run: pnpm run deploy -- --target flatpak

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/*.flatpak
          generate_release_notes: true
