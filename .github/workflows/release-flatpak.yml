name: Release Flatpak

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils appstream
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Cache the Flatpak runtime/SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-user-gnome-50

      - name: Install the GNOME runtime and SDK
        run: flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Flatpak
        run: pnpm run deploy -- --target flatpak

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/*.flatpak
          generate_release_notes: true
